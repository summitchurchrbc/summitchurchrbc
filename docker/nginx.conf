# This file is included from nginx's http {} context (Alpine: http.d/).
# Railway/Cloudflare terminate TLS and proxy HTTP to this container on $PORT
# (typically 8080). nginx's default directory redirect would then emit
#   Location: http://$host:8080/path/
# because $scheme is http and the listen port is not 80.

map $http_x_forwarded_proto $redirect_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback for any nginx-generated redirects we don't rewrite below:
    # relative Location (e.g. /services/) never includes :8080 or http.
    absolute_redirect off;
    port_in_redirect off;

    # Next.js is exported with trailingSlash: true, so pages are directories
    # (e.g. /services/index.html). Redirect the no-slash URL using the public
    # scheme/host, not the internal listen port.
    if (-d $request_filename) {
        rewrite [^/]$ $redirect_scheme://$http_host$uri/ permanent;
    }

    location /_next/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /live-status.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        root /usr/share/nginx/html;
    }

    location = /services.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        root /usr/share/nginx/html;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # WordPress slug redirects (absolute public URL so they don't inherit :8080)
    location = /services-3 { return 301 $redirect_scheme://$http_host/services/; }
    location = /services-3/ { return 301 $redirect_scheme://$http_host/services/; }
    location = /contact-2 { return 301 $redirect_scheme://$http_host/contact/; }
    location = /contact-2/ { return 301 $redirect_scheme://$http_host/contact/; }
    location = /picture-gallery { return 301 $redirect_scheme://$http_host/; }
    location = /picture-gallery/ { return 301 $redirect_scheme://$http_host/; }
    location = /gallery { return 301 $redirect_scheme://$http_host/; }
    location = /gallery/ { return 301 $redirect_scheme://$http_host/; }
    location = /service-times-location { return 301 $redirect_scheme://$http_host/service-times/; }
    location = /service-times-location/ { return 301 $redirect_scheme://$http_host/service-times/; }
    location ~ ^/aiovg_videos/ { return 301 $redirect_scheme://$http_host/services/; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
